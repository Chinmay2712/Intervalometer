name: iOS build

# Builds an unsigned .ipa on a GitHub-hosted Mac. Download it from the run's
# "Artifacts" section and install it with Sideloadly (signs it with your Apple ID).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      # env.json is not in the repo. Use the ENV_JSON secret if you add one
      # (Settings > Secrets and variables > Actions), otherwise empty values.
      - name: Create env.json
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          if [ -n "$ENV_JSON" ]; then echo "$ENV_JSON" > env.json; else cp env.example.json env.json; fi

      - name: Install packages
        run: flutter pub get

      - name: Run tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      # A free Apple ID can't sign "Sign in with Apple". Login is hidden in the
      # app for now, so drop it from this build only.
      - name: Remove Sign in with Apple entitlement
        run: /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.applesignin" ios/Runner/Runner.entitlements || true

      - name: Build iOS app (unsigned)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign --dart-define-from-file=env.json 2>&1 | tee build.log

      # Shows the error lines on the run's summary page (readable without
      # opening the full log).
      - name: Summarise errors
        if: failure()
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            grep -E "error:|Error:|EXCEPTION|Expected:|Actual:|FAILED|Failed to|\[E\]" "$f" | head -40 | while IFS= read -r line; do
              echo "::error title=$f::${line:0:400}"
            done
          done

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Valometer.ipa Payload

      - uses: actions/upload-artifact@v5
        with:
          name: Valometer-ios
          path: Valometer.ipa
          retention-days: 30
